# Game logic: mod_24860, 0x24860..0x24e50 (analysis/modules.toml range;
# 10 discovered functions 0x248e0..0x24e50, 0x570 bytes).  This is the
# save-file loader and writer of Warcraft I plus its record rebasing helpers
# ("SAVE.C"/"REMOTE.C" are the neighbouring link-save object at 0x23ec0;
# the loader callers here are the game load/save code fn_195ac 0x195ac,
# fn_1b198 0x1b198, UnitsInitGame 0x2d4b8 and the save-slot wrappers
# fn_1aa7c 0x1aa7c / fn_1abc0 0x1abc0).  Area notes:
# docs/subsystems/save_format.md.
#
# The module reads and writes one in-memory image:
#   0x56a-byte link header (only in the image, see the data entries)
#   + 0x14 prefs block, 0xbb8 scenario block, 0x200 game state, the four
#   0x2000/0x4000 map arrays, 200 unit records (0x47e0) and 100 object
#   records (0xed8) = 0x109ee bytes.
# Pointers inside the records are stored as offsets from a base
# (unit_array, object_array, the scenario block) by RefRelocate 0x248e0.
#
# NOTE (0x24860, data not code): discovery used to start a function at
# 0x24860; the 2026-11-18 stack-balance veto removed it (tools/wc1/analysis.py).
#   0x24860..0x2487a: 26 data bytes; 0x2487a..0x248e0: 102 bytes of 0x44, the
#     only 8+-byte 0x44 run in the code object (not compiler filler);
#   no call, jump or 32-bit pointer fixup anywhere in the image targets the
#     block (analysis.Program.fix_at and wc1.xref are both empty for it);
#   XOR 0x64 the 26 bytes are "warcraft\0cd\0version\0" + six bytes and the
#     0x44 filler is spaces - an unreferenced, never-decoded text buffer left
#     over from the original build (no xor uses the constant 0x64).
# There is no symbol entry: it is not a function.  Prose and the mechanical
# checks: docs/subsystems/save_format.md section 5,
# tests/test_mod_24860.py::test_unreferenced_block_at_0x24860.

