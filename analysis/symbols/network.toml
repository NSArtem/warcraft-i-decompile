# NETWORK.C: the two-player link's transport drivers (module NETWORK.C,
# 0x1f050..0x209e0; docs/subsystems/network.md).
#
# The module holds TWO interchangeable drivers behind the six-entry dispatch
# vtable net_driver 0x59b90 (installed by the dispatch layer's fn_20a80
# 0x20a80, which picks the set from connection_type 0x516ac):
#   * the IPX driver          0x1f050..0x1f62c = NetIpx*   (connection_type 2)
#   * the serial/modem driver 0x1f62c..0x209e0 = NetSerial*/NetModem*
#     (connection_type 1 modem and 3 direct link)
# The vtable slots, in order: start, connect/handshake, stop, receive(msg),
# send(msg, len), drain (docs/subsystems/network.md).
#
# Nothing here duplicates net_link.toml (the 0x12c70..0x13270 ring layer) or
# save_score.toml (SAVE.C/SCORE.C): every address below was unnamed before.

# ------------------------------------------------------------------ IPX driver

