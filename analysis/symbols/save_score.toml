# Game logic area "save_score": the SAVE.C range 0x23ec0..0x24860 and the
# SCORE.C range 0x24e50..0x25820 (analysis/modules.toml names both; the guide
# list in docs/REFERENCES.md R1 contains SAVE.C and SCORE.C).
#
#   * SAVE.C turned out to be the *two-player link* half of saving/loading:
#     nothing in it opens a file. The record/block layout and the message
#     types are documented in docs/subsystems/save_score.md. The code that
#     actually reads and writes save files is the neighbouring mod_24860
#     (0x24860..0x24e50: fn_24900 loader, fn_24bf0 writer, fn_249a4/fn_249f8
#     stream helpers) - not part of this area.
#   * SCORE.C is the per-player score accounting (the "score" word array at
#     0x50e34, the 2500-point pool at 0x5a0ce), the rank titles Slave..Designer
#     (0x531b4/0x53200) and the 72x72 score panel (0x53140..0x5315c).
#
# Reconstruction state (docs/subsystems/save_score.md section 6):
#   * byte-matched (T3, `src =`) and built from C: WordInRange 0x2417c
#     (src/save_score/save.c), ScoreSetUncapped 0x257c0 (src/save_score/score.c);
#   * near-miss reference C (same logic, OW2 register allocation differs -
#     codegen.md V2/V3): src/save_score/{save,score}_reference.c, verified
#     differentially (T4) by tests/test_save_score.py.
#
# File wrappers (FileOpen/FileSeek/FileRead/FileWrite, 0x31940..0x31bca) and
# the resource layer are named in analysis/symbols/resources.toml and are
# cited as callees, never renamed here. 0x23edc is named by
# analysis/symbols/codegen_promo.toml (NetLinkHandshake, module SAVE.C);
# this file deliberately has no entry for it - see
# docs/subsystems/save_score.md section 2.1 for its analysis.

# ================================================================ SAVE.C
# Link messages: a 16-byte buffer at 0x5a000 {u8 size; u8 type|flags; u16
# sequence; u8 payload[12]}. fn_131d8 (mod_131d8, the link send routine)
# stamps the sequence word at +2 from [0x58d9c], sets bit 0x40 (and 0x80 when
# [0x516ae] and [0x52584] are both set), copies size bytes into the 10x136-byte
# message ring at 0x58848 and hands it to the dispatch layer. Message types
# seen here: 1 = "nothing", 2 = game-identity block, 4 = raw data,
# 5 = save/load event block (all masked with 0x3f on receive).

