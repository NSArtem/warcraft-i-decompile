# Game logic: CMD.C, 0x123f0..0x12b80 (analysis/modules.toml range "CMD.C",
# 18 functions, 0x790 bytes).  Area notes: docs/subsystems/cmd_123f0.md.
#
# The object holds two groups:
#   * 0x123f0..0x127ff - the scrolled terrain cache.  terrain_cache (0x58574,
#     graphics.toml) holds the visible 15x11 tiles (240x176 px) as bytes; tile
#     (x, y) starts at ((y * 256 + x) * 16) truncated to 16 bits, the same
#     offset MapDrawTerrain (0x10010) reads.  These functions paint tiles into
#     it and slide it when the view moves; the whole view is rebuilt by
#     MapViewSetScroll (0x1274c), which is what the map loader calls.
#   * 0x12800..0x12b80 - the typed command layer.  Cheat phrases are stored
#     obfuscated in the pool at 0x51218; CheatCodeMatch (0x12800) compares
#     lower-cased input against it.  The resulting flag word is 0x51214.
#
# Codegen: this object needs `-s -ot -oa -4r -zp2` (see the -oa evidence under
# MapViewScrollUp). With the project default OPT set (-ol, no -oa) only the two-store
# MapViewInitLimits survives; every other function is 5-90 bytes off, and adding -ol
# back onto the -oa set breaks CheatCodeCommand again (21 bytes).

