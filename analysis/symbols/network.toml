  "the loop 0x1f13d-0x1f1b2 (index 1..9) builds the nine receive ECBs: slot+0x04 = 0, slot+0x0a = the socket, slot+0x22 = 1 (fragment count), slot+0x24 = the slot's real-mode offset of slot+0x2a, slot+0x26 = the block's real-mode segment (desc+8), slot+0x28 = 0xa6, and posts each with fn_1ddd0(segment, slot+0x22) = IPX listen-for-packet",
  "0x1f1bd-0x1f223 builds the transmit ECB (slot 0) with the extra words slot+0x2f = 4, slot+0x30 = dword[block+2], slot+0x3a = block[0] and returns 1",
