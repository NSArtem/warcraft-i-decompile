# mod_295d0 (0x295d0..0x2b1b0): the computer opponent's unit AI.
# See docs/subsystems/mod_295d0.md.  Names, prototypes and evidence; the C is
# in src/mod_295d0/ (one function per file) and the T3 check is
# `python3 -m wc1.match src/mod_295d0/<file>.c` under Watcom 10.0a.
#
# The module is identified by its callers and its bodies: UnitIdleTick 0x10ee8
# calls the worker tick 0x2b064 and the spellcaster tick 0x2a8f4 only for units
# whose owner's player type (0x5008c) is 1, UnitCreate 0x2e6f4 calls 0x29cf8 to
# give a new AI unit its first order, UnitRemove 0x2e14c calls 0x29ea8 to drop
# it from the AI counters, and the scenario start 0x195ac calls 0x295d0.
# The spellcaster tick reads column 1 of the per-player spell table 0x50017,
# i.e. player 1 - the computer player in a single game.

[[func]]
addr = 0x295d0
name = "AiReset"
src = "src/mod_295d0/ai_reset.c"
conv = "watcall"
proto = "void AiReset(int resume)"
module = "mod_295d0"
confidence = "verified"
verified_by = "match: python3 -m wc1.match src/mod_295d0/ai_reset.c"
evidence = [
  "0x295d0..0x29641: `test eax,eax; jne` returns at once when the argument is non-zero (0x295d4-0x295d6), i.e. it only clears on a new game; caller 0x196fe in the scenario start 0x195ac passes the same flag 0x195ac itself uses to choose between a fresh scenario and a loaded save image (`test eax,eax` at 0x195bf)",
  "loop i = 0..4 (0x295d8-0x29614): word 0 = to ai_busy_count 0x50df8, ai_work_count 0x50dee, ai_site_count 0x50e54, ai_helper_count 0x50e5e; word -1 to the first word of the dword array ai_home_point 0x50e0c (+4*i) - the code writes a word, so the field is a Point.x",
  "then ai_retarget_timer (0x50de8) = 1 (0x29616), ai_attack_point.y (0x50dec) = -1, ai_attack_point.x (0x50dea) = -1 (0x2961f-0x2962b) and the dword ai_wave_timer (0x50e4a) = 0x1770 (0x29632)",
  "the 0x1770 value is the initial interval the tick 0x29a08 reloads for a mission without the 0x84/0x40 condition bits",
]

