  "0x1a3c5-0x1a3d6: memset(map, 0xff, 0x40) - a 64-entry byte table",
  "0x1a3da-0x1a44f: for i = 0..0xff: lum = ((palette[i*3]*0x4d + palette[i*3+1]*0x97 + palette[i*3+2]*0x1c) >> 8) & 0x3f (0x4d/0x97/0x1c = 77/151/28, the 0.30/0.59/0.11 luminance weights), writes {R=lum, G=0, B=0} into palette_target (0x62570) at i*3 and, for i < 0x80, map[lum] = i",
  "0x1a44a-0x1a456: PaletteSet(0, 0x100, palette_target) - the screen, which still shows the old palette, turns into a red monochrome image",
  "0x1a45b-0x1a4af: fills the 0xff holes of the map with a neighbour (map[i-1], else map[i+1]), repeating until no hole was filled, so every 6-bit luminance has a colour index",
]

