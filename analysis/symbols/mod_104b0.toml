# Early game-code modules: mod_104b0 (0x104b0..0x110a0, unit combat/damage/
# target acquisition), mod_110a0 (0x110a0..0x11530, attack order handlers;
# 0x110a0 is 4 bytes of constant data) and mod_11530 (0x11530..0x119c0,
# building production/training/research; 0x11530 is 8 bytes of constant data).
# Notes: docs/subsystems/mod_104b0.md.  The unit record layout is the one in
# docs/subsystems/game_2c4e0.md, extended with the combat fields (+0x3a last
# attacker, +0x3e..+0x46 production state, +0x4a production word).
#
# The module is the front of the code object, immediately after the
# animation-script opcode stubs (0x103d2..0x104b0, modules.toml
# "asm_blit_stubs"): the attack animation of a unit gets here through the
# opcode handlers and the order table at 0x5158c.
#
# 0x1132c is already named by codegen_promo.toml (fn_1132c, the "attack:1"
# FatalError stub) and is not repeated here.

# ---------------------------------------------------------------- constants
# Two constant arrays sit at the start of the later objects; both are read
# through absolute addresses, so they live in the code segment of the original.

[[data]]
addr = 0x110a0
name = "wander_direction_offsets"
type = "signed char[4]"
confidence = "medium"
evidence = [
  "image bytes at 0x110a0: 00 01 ff 00 (4 bytes, the first bytes of the mod_110a0 object; no LE fixup there, so not a pointer)",
  "fn_11298 loads the whole dword (0x112a3 `mov ecx,dword [0x110a0]`) and walks its four bytes as direction deltas: byte 0 -> `movzx ebp,byte [esp+ecx]`, added to the facing and masked with 7 (0x112ba-0x112c0); 0x00 = keep the facing, 0x01 = +1, 0xff = -1; the loop stops at a 0 entry that failed (0x11319)",
  "not a function: the two decodings `add byte [ecx],al; inc dword [eax]` execute only under code discovery's object-start seed; nothing calls 0x110a0 and there is no relocation to it",
  "usage: fn_11298 = UnitWander (no target, pick a free adjacent direction)",
]

