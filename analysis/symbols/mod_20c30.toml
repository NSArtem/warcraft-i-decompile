# The build/placement box and the packet tail around it.
#
#   PACKET.C tail   0x21c20..0x21ce8  the four "small message" senders
#   mod_21cf0       0x21cf0..0x21de4  LayerAdd / ResourceFreeBody (the layer
#                                    registry helpers every panel uses)
#   PLACEBOX.C      0x21df0..0x22c50  the "Select location" build/placement UI:
#                                    box overlay, tile check, road/wall/build
#                                    confirm, and the order-3 move handler the
#                                    placement flow drives
#
# The area name in this file (mod_20c30) is the one the brief gave; the code
# range is the tail of PACKET.C, all of mod_21cf0 and all of PLACEBOX.C.  See
# docs/subsystems/mod_20c30.md for the flow, the wire packets and the tile
# checks.  Unit record: docs/subsystems/game_2c4e0.md.  Order table:
# docs/subsystems/mod_13f60.md.
#
# Five functions in the range are already named by another area's file
# (status.toml: NetSendControlPacket 0x21c20; playflic.toml: ResourceFreeBody
# 0x21cf0; mod_104b0.toml: fn_2207c/fn_2220c/fn_222d8).  They are analysed
# here but NOT duplicated; see the report/change request.

# ---------------------------------------------------------------- placement state

[[data]]
addr = 0x59bd0
name = "place_type"
type = "unsigned char[2]"
confidence = "high"
evidence = [
  "two bytes, one per network player, holding the unit type being placed: written from the packet payload at 0x22805 (`mov byte [eax+place_type], cl` with eax = net_event_pending) and read as `[net_event_pending + place_type]` at 0x2295f, 0x22af4, 0x22b79, 0x22bed",
  "the value is used as a unit type in the size table 0x51abc (0x2283f) and in the road/wall checks 0x225b3/0x225cc (0x34 road, 0x35 wall), so it is the byte the command card passed to PlaceBoxStart",
]

