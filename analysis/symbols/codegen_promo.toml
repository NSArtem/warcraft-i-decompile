name = "NetLinkHandshake"
conv = "watcall"
proto = "short NetLinkHandshake(void)"
module = "SAVE.C"
confidence = "high"
evidence = [
  "only caller fn_15230 (0x15230), which stores ax into [0x516ae] - the (short, void) signature follows from the ax use at the call site",
  "the two-player identity handshake, fully analysed in docs/subsystems/save_score.md 2.1: builds the 12-byte NetRecord on its stack (start stamp [0x532b4], time via fn_331eb(0), campaign byte [0x52584], cd_present [0x52518], version byte 0x25, side flags [0x52a5e]; 0x23f22-0x23f51), sends it as the type-2 message, delays 0x14 cs and polls both directions through fn_12f24 (0x23f8b, 0x23fb9) for the partner's type-2 reply",
  "the reply's 12 bytes are copied to net_enemy_record (0x5a084, memcpy at 0x23ff6) and compared field by field (time 0x2402c/0x24032, campaign 0x2401d, version 0x24001); byte 9 is ORed into [0x52518] (0x24093-0x2409b) and a zero result shows the 'At least one player must have a WARCRAFT CD present.' dialog (0x578e8/0x240bb); byte 11 is adopted as the own [0x52a5e] (0x24065/0x2407f); success sets the link-active word [0x5310c] (0x240cf)",
  "net_enemy_record is written verbatim into save files by fn_24bf0 (count 0xc at 0x24c4c) - how the identity survives a save (tests/test_save_score.py::test_net_record_layout_matches_the_save_file)",
  "returns 0 unless fn_20b2c() != 0 (else tail-jumps into NetLinkExit 0x240f0); seeds the LCG through fn_19470 (0x24089) with the dword [0x5a088]; per-slot loop against the slot count [0x5a8d6]",
  "semantic rename of the former fn_23edc placeholder (2026-11-17, save_score area report); the body is not reconstructed - address only",
]

