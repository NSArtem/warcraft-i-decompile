# Area mod_13f60 (0x13f60..0x16390, 68 discovered functions, analysis/modules.toml
# candidates DISPATCH.C / DLG_SET.C / DLGS.C).
#
# The range holds two source files:
#
#  * the unit ORDER DISPATCH (`DISPATCH.C`, 0x13f60..0x145d0): one update
#    handler per unit order.  0x2ec0c calls
#    `[order_update_table + order*4]` with the unit in eax (0x2ed0f-0x2ed19);
#    the 32 entries at 0x5158c name the orders 0x00..0x1f, and 0x145d0 is the
#    'dispatch:5' FatalError default that orders 0x1e/0x1f point at
#    (tests/test_mod_13f60.py::test_order_table_names_this_area);
#  * the two-player SETUP MENU (`DLGS.C`/`DLG_SET.C`, 0x145e6..0x16390): the
#    main menu, the game-type / campaign / army / map / race dialogs, the
#    modem/serial/network settings and the state machine that runs them
#    (`setup_state` 0x593da indexes the 17-entry table at 0x51718; every dialog
#    is a DATA.WAR resource run by 0x180a8).
#
# Dialog resources were decoded with wc1.resources_war (their button labels are
# the evidence for the menu names below, e.g. 0x17c "Select Game Type: Single
# Player / Modem Game / Network Game / Direct-Link Game / Cancel", 0x18e..0x193
# "Set Army", 0x196/0x197 "Set Player Races", 0x180 "Set Map").
#
# Addresses already named elsewhere and deliberately absent here:
# 0x150f0, 0x15170, 0x15230, 0x15558 and data 0x51530/0x516ae/0x59230
# (analysis/symbols/codegen_promo.toml).

