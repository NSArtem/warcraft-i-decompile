# PACKET.C, 0x214b0..0x21cf0 (23 functions, 0x840 bytes; analysis/modules.toml
# names the module from the guide list, docs/REFERENCES.md R1).  This is the
# two-player command layer: every player command (move/attack/stop/build/
# train/research/spell/selection/placement/chat/cheat/menu) is packed into a
# "packet", sent to the partner, and *executed on both machines by the same
# dispatcher* - locally through the loopback (see docs/subsystems/packet.md
# section 2), so the two simulations stay in step.
#
# Area notes: docs/subsystems/packet.md.  Reconstructed C: src/packet/.
#
# Already named elsewhere (no duplicate entries here):
#   0x214d4  PacketSend           PACKET.C  (this file - the module's send
#                                  entry)
#   0x21968  ResetPacketId       PACKET.C  (net_link.toml)
#   0x21974  NetResetPacketId    PACKET.C  (net_link.toml)
#   0x21af8  PlaceBoxPress       PACKET.C  (mod_20c30.toml - the type-5 sender,
#                                  named for its role as the box press handler)
#   0x21c20  NetSendControlPacket PACKET.C (status.toml)
#   0x21c44  NetSendCheatFlags   PACKET.C  (mod_20c30.toml)
#   0x21c68  NetSendChatText     PACKET.C  (mod_20c30.toml)
#   0x21cb8  NetSendSyncMessage  PACKET.C  (mod_20c30.toml)

# ---------------------------------------------------------------- the module
# Packet body (the payload NetSendDataMessage wraps in a link type-4 message):
#   +0  u8   type (the cd_215a8 jump-table index, 1..0x11)
#   +1  u16  sync id (packet_id; stamped by PacketSend, then cleared)
#   +3  ..   payload
# Link message (net_msg 0x5a000): +0 size, +1 type|flags, +2 sequence, +4 the
# packet body (docs/subsystems/save_score.md section 1).

