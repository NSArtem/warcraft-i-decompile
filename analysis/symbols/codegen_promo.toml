# Promotion of the src/codegen game samples (docs/subsystems/codegen.md section 5,
# AGENTS.md next step 1 tail): names that let `wc1.match` resolve these files
# instead of only `wc1.codegen_sweep`.  The fn_/dat_ names are *placeholders*
# carried over from the sample sources (address-derived, no semantic claim);
# semantic naming belongs to the game-logic areas (AGENTS.md step 3).  Entries
# here only cover addresses that no other analysis/symbols/*.toml names or
# covers as a range.  FatalError (0x30bf0, modules.toml) and strcpy (0x31cef,
# clib.toml) are referenced by these samples but owned elsewhere.

