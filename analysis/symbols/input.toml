# Input: event queue, keyboard (IRQ1 handler, port 0x60), mouse (INT 33h
# callback), key translation. war.exe 0x30ea0-0x31764, 0x32a80-0x32b40, 0x33040.
# Event record (12 bytes) layout derived from the producers/consumers below:
#   +0 word type  (1 move, 2 L-press, 4 L-release, 8 R-press, 0x10 R-release,
#                  0x80 key-down, 0x100 key-up, 0x400 idle/tick)
#   +2 word sub-code   +4 word x   +6 word y   +8 byte scancode
#   +9 byte modifier bits (EvtProcess)   +0xa word translated key (ascii | scan<<8)
# These names echo the Insider's Guide EVTGET.C / EVTPRO.C (module names are
# only a hint, see docs/REFERENCES.md); the "evt lock"/"evt unlock" strings
# at 0x57e54/0x57e60 support the EVT prefix.

