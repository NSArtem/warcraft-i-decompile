# mod_2efd0 (war.exe 0x2efd0..0x3024e), 26 functions, 0x127e bytes.
#
# The object is two halves with a visible seam at 0x2f350:
#
#   * 0x2efd0..0x2f34e  the map selection layer - click-select with the
#     "select all of the same type" modifier, the drag rectangle (marquee)
#     that follows the mouse, and the order packet the command card sends.
#     The 0x2f350->0x2f15c/0x2f0c8 callback installation marks the second
#     half, so the split is 0x2f350 (module boundary evidence: the callers,
#     see docs/subsystems/mod_2efd0.md section 1).
#   * 0x2f350..0x30246  the mission-end layer - the per-mission
#     victory/defeat condition functions, the 0x140-tick poll that calls
#     them, and the win/lose screen ("win1.war"/"win2.war"/"lose1.war"/
#     "lose2.war", 0x552d0..0x552ec) with the animated 13-line score.
#
# The 0x2efd0 boundary is linker padding (12 zero bytes before it,
# analysis/modules.toml); the second seam is inside the object and not
# padded, which is why the module is one range here.  Guide candidates
# [R1]: SELECT.C-shaped code for the first half, SCORE.C for the second
# (SCORE.C is the in-game score *panel* at 0x24e50..0x25820, so the
# mission-end screen may be a further file; no C string survives in
# v1.22h - name_confidence stays speculative).
#
# Unit record: docs/subsystems/game_2c4e0.md (0x5c bytes).  Event record:
# docs/subsystems/input.md.  Order ids/table: docs/subsystems/mod_13f60.md.
# Placement state: docs/subsystems/mod_20c30.md.

