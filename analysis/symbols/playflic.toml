# PLAYFLIC.C (war.exe 0x22c50..0x23d10), 46 functions, 0x10c0 bytes.
#
# The object is the FLIC movie player plus the credits animation driver:
#   * 0x22c50..0x22f47  the player core and the callbacks it installs,
#   * 0x22ff4..0x23667  the 27 script opcode handlers of the dispatch table
#     at 0x52ea8 (op 0x0e is IntroBeginFlic itself),
#   * 0x23668..0x2379f  the script interpreter,
#   * 0x237a0..0x23adf  the two credits animation ticks,
#   * 0x23ae0..0x23d08  the top level and its callers.
#
# Reachability: nothing outside this range refers to it.  Every LE fixup
# whose target lies in the range has its source inside the range (the opcode
# table 0x52ea8 and the tick slot 0x59eb4), and the object offsets of the
# entry points (0x13ae0, 0x13c74, 0x13c94, 0x13cb4, 0x13cd4, 0x13cf4,
# 0x13668) do not occur as dwords in the data object either.  The code is
# linked dead in v1.22h; docs/subsystems/playflic.md section 1.
#
# The callees at the end of the file belong to other objects (flic_decode
# 0x19020..0x19470, mod_21cf0, the credits module around 0x1c1dc and the UI
# event layer 0x18488/0x184cc).  They are listed here only so this object's
# calls resolve for T3; their owning areas should take them over (the names
# are provisional, the evidence is the call site plus the body).

# --------------------------------------------------------------- globals ---

