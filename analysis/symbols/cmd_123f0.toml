# ---------------------------------------------------------------- commands
# Typed text reaches CmdProcessText from two places: the in-game message window
# (fn_1b690, which on a match sends the new flag word with network packet 0x10
# via 0x21c44 and otherwise sends the text as chat packet 0xf via 0x21c68) and
# the process command line (fn_1d740, which calls SetCheatFlags after each
# argument).  The cheat flag word is 0x51214.

