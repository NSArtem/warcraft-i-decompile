# per-tick unit update (0x2ced0..0x2efd0).  The two ranges behave like PATH.C
# and UNIT.C of the Insider's Guide module list (docs/REFERENCES.md R1), but
# the module names in analysis/modules.toml stay mod_2c4e0 / mod_2ced0.
# Layout of one unit (0x5c bytes) and the terrain map are in
# docs/subsystems/game_2c4e0.md; functions cite the field offsets they touch.

# ---------------------------------------------------------------- draw order
# The unit array at 0x59640 is walked linearly; the draw list is a
# null-terminated array of Unit* at 0x5a490 whose order is the painter's order.
# The sort key of a unit is 0 when (flags & 0x207) != 0, else its tile row
# (Unit->ty, +0xc): units with those flag bits are drawn in front.

[[data]]
addr = 0x5a490
name = "draw_list"
type = "void *[201]"
confidence = "medium"
evidence = [
  "0x2d4b8 (map/game init) memsets 0x324 bytes = 201 * 4 at 0x5a490 and 0x2d058 refills it from the unit array; 0x2cfa8/0x2cfd8/0x2ced0 walk it as a null-terminated Unit* array (indices +0, +4, ...)",
]

