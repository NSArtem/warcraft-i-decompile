# GAMEDLG.C (0x1a3c0..0x1af20) - the modal dialog boxes.
#
# All of them run a *page* resource through the generic box routine
# DialogRun 0x180a8 (id 0xff..0x1dc, the page carries the frame, caption,
# buttons and their action numbers).  The module adds the modal screen switch
# (ModalScreen 0x1a560: full-screen 320x200 layer + layers 13..22 hidden), the
# per-race frame offset (page id + scenario_race - every page has a human and
# an orc variant) and one function per dialog.  The page ids, their captions
# and the per-function notes are in docs/subsystems/gamedlg.md.

# ============================================================== the runtime

