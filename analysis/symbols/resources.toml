# Resource archive layer: DATA.WAR access, codec dispatch, LZSS.
# Format and call graph: docs/subsystems/resources.md.
# Library primitives (fopen 0x31964, fclose 0x31940, fseek 0x31a80, fread 0x31adc,
# slow-path getc 0x31a18, malloc 0x32558, free 0x32780, atexit 0x342b0, fatal
# printf-like 0x30bf0, setvbuf 0x33de1) are named by clib.toml, not here.

[[func]]
addr = 0x41550
name = "LzssDecode"
proto = "void LzssDecode(unsigned char *dest, unsigned count)"
confidence = "verified"
verified_by = "difftest: tests/test_resources_lzss.py (original code under wc1.emu; 32 DATA.WAR entries in the test incl. smallest/largest, 11 more via inline-getc input, chunked and error paths; one-off sweep of all 583 entries identical)"
evidence = [
  "codec 1 'decode' slot of the descriptor at 0x565d0 (pointer at 0x565d9); called through the table by ResourceRead (0x32740, call [ecx+0x5652d] at 0x3276f)",
  "streaming LZSS: inlined getc on the FILE* in 0x5581c (cnt at +4, ptr at +0, flags at +0xc, slow path 0x31a18 for CR/^Z/empty, see 0x41586-0x415b0); 4096-byte ring at [0x5677c]",
  "flag byte shifted right each item in 0x635d6 (refilled as byte|0xff00 at 0x415c5); bit set = literal copied to dest and ring[0x635d2++ & 0xfff] (0x4162c-0x41658), bit clear = 16-bit word: src = w & 0xfff (0x635d0), len = (w>>12)+3 (0x4172c, stored in 0x635d4)",
  "pending match length 0x635d4 and source 0x635d0 survive between calls, so a match can be split across calls; loop ends when the byte budget edx or the remaining-size counter 0x5ad40 reaches 0 (0x4166b, 0x41671)",
  "difftest: run through the original OpenArchive/ResourceBegin/ResourceRead on every entry sampled in tests/test_resources_lzss.py, plus chunked decode calls of random sizes and a FILE with an inline buffer (no slow path)",
]

