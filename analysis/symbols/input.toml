type = "Event *"
confidence = "high"
evidence = ["EvtInit (0x316a0) stores alloc(size*12) here; EvtPost (0x30eb8) copies a 12-byte event to evt_queue + head*12; EvtGet (0x31598) copies from evt_queue + tail*12"]

