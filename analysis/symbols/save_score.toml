# ================================================================ SCORE.C
# Score model: player_score[4] (0x50e34) is a per-player number that the game
# raises for activity and lowers for losses; score_pool (0x5a0ce) caps the
# amount handed out, score_cap (0x5a0d2) caps one player's total and
# score_rate (0x5a0cc) is the per-tick income. Rank titles come from
# rank_thresholds + the side-specific name table. The panel is a 72x72 bitmap
# loaded from resource 0xe6+side and text is drawn into it.

