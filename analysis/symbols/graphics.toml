# Graphics: VGA mode 13h, bitmaps, drawing primitives, text, palette, screen
# layers/dirty rectangles, mouse cursor drawing, tile and sprite blitters.
# Covers war.exe 0x10010-0x1b0xx (map/tile blitters), 0x2d704 (unit sprite),
# 0x31d40-0x34c70 (video/window library) and 0x3a?-0x3d? (blit helpers).
#
# Conventions found in this library (evidence in the entries below):
#   Bitmap  = { short w; short h; uint8 *data }   (8 bytes, row stride == w)
#   Rect    = { short x1,y1,x2,y2; short w,h }    (12 bytes, inclusive corners)
#   cur_bitmap (0x55438) is the implicit destination of every primitive.

# ---------------------------------------------------------------- data ----

[[data]]
addr = 0x55438
name = "cur_bitmap"
type = "Bitmap *"
confidence = "high"
evidence = [
  "every primitive (HLine 0x3ac10, VLine 0x32970, BitmapClear 0x31fc0, DrawText 0x31dcc, Line 0x34ad0) loads it, reads w=[p], h=[p+2], data=[p+4] and writes into data+y*w+x",
  "0x1b00c/0x1b048 and 0x322c1 store &backbuf_bm (0x5a870) into it before drawing; 0x320f0 stores &cursor_save_bm (0x5ad10) and restores it afterwards",
]

