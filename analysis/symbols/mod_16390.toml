# Area mod_16390 (0x16390..0x19020, 54 discovered functions, analysis/modules.toml
# range "mod_16390").  Evidence-driven names and types; see
# docs/subsystems/mod_16390.md for the whole picture.
#
# What the range actually contains (the module boundaries from linker padding
# are coarse, the strings in analysis/modules.toml are a pool-slice heuristic):
#
#  * DLGS.C, the dialog engine (0x16390..0x1825c): descriptor resources are
#    loaded (DialogLoad 0x16694), pointer fields relocated (DialogRelocate
#    0x166bc), two screen layers per dialog created (DialogCreate 0x168b4) and
#    a modal loop runs over the 0x1c-byte item list at dialog+0x26
#    (DialogLoop 0x17e54 / DialogItemLoop 0x1700c / DialogActivateItem
#    0x17ce4).  Item types: 0 button/radio row, 1/2 prev/next, 3 radio text,
#    4 art-only, 5 scroll list, 6 action, 7/0xb string edit, 8/9/0xa variants.
#    The modal dialog entry is DialogRun 0x180a8 (27 callers, all menus and
#    ShowMessage 0x1a894).
#  * the UI event layer that the dialogs and the menus use
#    (0x182e4..0x1878c): key dispatch (ctrl+M music / ctrl+S sound / ` int3),
#    mouse button press/release bit tracking, the mouse-move and idle
#    callbacks, UiInputInit 0x18488 and UiEventPump 0x184cc (both already
#    named in playflic.toml, not repeated here) and the network variant
#    UiEventPumpNet 0x185b4.
#  * the epilogue screen (0x18790..0x19013) that main 0x1e158 calls when the
#    campaign is won (call 0x1e32f): OutroPlay 0x18fb0 plays the race-specific
#    finale FLIC ('ofinale.war'/'hfinale.war', 0x51798/0x517a4) and then the
#    scrolling "The End" credits (string 0x56be8, text resource 0x1d3).
#
# Names reused from other areas (NOT repeated here, they own the entry):
#   0x18488 UiInputInit, 0x184cc UiEventPump (playflic.toml);
#   0x59400 event_handlers, 0x5940c status_mouse_callback,
#   0x59414 status_frame_callback, 0x5941c status_click_callback (their areas);
#   0x593f6 screen_mode, 0x5175c preview_rect, 0x5176a setup_quit,
#   0x51768 dialog_auto_update, 0x5176c edit_char_hook (mod_13f60.toml);
#   0x50088 scenario_race, 0x59616 game_mode.
#
# The data this area needs but no other TOML names yet (shared with graphics /
# playflic; a change request in the report asks the owners to adopt them):
#   layers 0x5aa90, layer_top_id 0x5aa78, cursor_hotspot_x/y 0x5aa60/0x5aa62.
# The compiler-loaded 16-bit field idiom used by the original here
# (`mov edx,[addr-2]; sar edx,16` = the word at addr sign-extended) is the
# same I16() playflic.h documents; the C uses it for the cursor hotspot.

