# mod_1b800 (0x1b800..0x1bf80): the game-event sound layer.
# See docs/subsystems/mod_1b800.md.  Names, prototypes and evidence; the C is in
# src/mod_1b800/ (one function per file), the T3 check is
# `python3 -m wc1.match src/mod_1b800/<file>.c` under Watcom 10.0a.
#
# The module is identified by its shape: one core (SndEvent 0x1b800) that maps
# an event id to a SndPlay slot (or to a caption in the message strip when the
# sound effects are off, table 0x52028), plus thin wrappers that pick the id
# for one game event (selection, order acknowledge, death, construction,
# bullets, enemy near the town hall).  Four wrappers are named by other areas'
# placeholders (0x1b9b8, 0x1bb90, 0x1bd04, 0x1bd54): see the change requests in
# docs/subsystems/mod_1b800.md.

