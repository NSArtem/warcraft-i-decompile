#   0x15170 -> MapChoiceForest,        mod_13f60.toml, src/mod_13f60/map_choice_forest.c
#   0x15230 -> NetGameHandshakeCallback, mod_13f60.toml, src/mod_13f60/net_game_handshake_callback.c
#   0x15558 -> PhoneNumberSave,        mod_13f60.toml, src/mod_13f60/phone_number_save.c
#   0x19478 -> GameRandom,             mod_19470.toml, src/mod_19470/game_random.c
# src/codegen/{bullet,mod_110a0,mod_13e60,mod_13f60,mod_19470}.c were removed
