  "0x21d0c..0x21de4: if the resource argument (cx) is not 0xffff, the bitmap is loaded from a DATA.WAR resource - ResourceBegin(cx, 0) then ResourceReadHeaderBody(bm, 0) (0x21d1e-0x21d35); otherwise bm->w/h = r->w/r->h and bm->data = GdsAlloc(w*h) cleared with _fmemset (0x21d37-0x21d73)",
